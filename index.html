
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1746a2">
  <title>Ankit Publication Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="brand">📚 Ankit Publication</div>
    <p>Your study notes, all in one place</p>
  </header>

  <main class="container">
    <h1>Find Your Study Notes</h1>
    <input id="search" type="search"
      placeholder="Search notes, subjects or course codes...">

    <h2>Browse Subjects</h2>
    <div id="subjects" class="subjects"></div>

    <h2>Available Notes</h2>
    <div id="notes" class="notes"></div>
  </main>

  <footer>© Ankit Publication</footer>
  <script src="app.js"></script>
</body>
</html>
